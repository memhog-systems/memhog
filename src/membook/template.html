<!doctype html>
<html$if(lang)$ lang="$lang$"$else$ lang="en"$endif$>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$pagetitle$</title>
    <meta name="description" content="Documentation for Memhog, boring infrastructure for stateful systems.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Memhog">
    <meta property="og:title" content="$pagetitle$">
    <meta property="og:description" content="Documentation for Memhog, boring infrastructure for stateful systems.">
    <meta property="og:url" content="https://memhog.com/">
    <meta property="og:image" content="https://memhog.com/og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Memhog Owner's Manual cover image">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="$pagetitle$">
    <meta name="twitter:description" content="Documentation for Memhog, boring infrastructure for stateful systems.">
    <meta name="twitter:image" content="https://memhog.com/og.png">
    <link rel="canonical" href="https://memhog.com/">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preload" as="image" href="leaf-fractal.webp" fetchpriority="high">
    <style>
      :root {
        color-scheme: only light;
        --bg: #f8fbf8;
        --text: #202122;
        --muted: #202122;
        --link: #375822;
        --line: rgba(32, 33, 34, 0.12);
        --panel: rgba(255, 255, 255, 0.92);
        --code-bg: rgba(32, 33, 34, 0.06);
        --code-text: #202122;
        --toc-active-offset: 3rem;
      }

      * {
        box-sizing: border-box;
      }

      ::selection {
        background: rgba(55, 88, 34, 0.24);
        color: var(--text);
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: var(--bg);
        font-family: sans-serif;
        overflow-x: hidden;
      }

      a,
      a:visited {
        color: var(--link);
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.14em;
      }

      a:hover,
      a:active {
        color: var(--link);
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.14em;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      code,
      pre,
      samp {
        font-family: monospace;
      }

      :target {
        scroll-margin-top: var(--toc-active-offset);
      }

      .page {
        width: min(100% - 2rem, calc(90ch + 36rem));
        margin: 0 auto;
        padding: 0;
      }

      .menu-button {
        display: none;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(14rem, 16rem) minmax(0, 90ch) minmax(14rem, 16rem);
        gap: 2rem;
        align-items: start;
      }

      .toc {
        grid-column: 1;
        position: sticky;
        top: 0;
        padding: 0;
        max-height: calc(100vh - 1rem);
        overflow: auto;
        font-family: "Linux Libertine", "Georgia", "Times", "Source Serif 4", serif;
        font-size: 1.04rem;
      }

      .content {
        grid-column: 2;
        padding-top: 2.5rem;
      }

      .toc ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .toc-leaf {
        width: 100%;
        aspect-ratio: 1140 / 1520;
        margin: 0 0 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .toc-leaf__image {
        display: block;
        width: 100%;
        height: auto;
        transform: scaleX(-1);
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      .toc li {
        margin: 0;
      }

      .toc ul ul {
        margin: 0;
        padding-left: 1rem;
      }

      .toc li + li {
        margin-top: 0;
      }

      .toc a {
        display: flex;
        align-items: center;
        min-height: 1.8rem;
        padding: 0;
        color: var(--link);
        line-height: 1.3;
        text-decoration: none;
      }

      .toc a:hover {
        text-decoration: underline;
      }

      .content h1,
      .content h2,
      .content h3,
      .content h4 {
        margin: 0 0 1rem;
        line-height: 1.12;
        color: var(--text);
        font-family: "Linux Libertine", "Georgia", "Times", "Source Serif 4", serif;
      }

      .content h1,
      .content h2,
      .content h3,
      .content h4,
      .content h5,
      .content h6 {
        font-weight: 400;
      }

      .content h1 {
        margin-top: 0;
        font-size: clamp(2.3rem, 4.5vw, 3.6rem);
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .content h1 + p {
        min-height: 0;
        padding: 0;
        background: none;
      }

      .content h2 {
        margin-top: 2.75rem;
        font-size: clamp(1.55rem, 2.3vw, 2.05rem);
      }

      .content h3 {
        margin-top: 2rem;
        font-size: 1.28rem;
      }

      .content p,
      .content li,
      .content td,
      .content th {
        font-size: 1.05rem;
        line-height: 1.65;
        color: var(--text);
      }

      .content ul,
      .content ol {
        padding-left: 1.35rem;
      }

      .content code,
      .content pre,
      .content samp {
        font-size: 1.05rem;
      }

      .content pre {
        margin: 1.5rem 0;
        padding: 1rem 1.1rem;
        overflow-x: auto;
        border-radius: 0.9rem;
        background: var(--code-bg);
        color: var(--code-text);
      }

      .content :not(pre) > code {
        padding: 0.14rem 0.35rem;
        border-radius: 0.4rem;
        background: var(--code-bg);
        color: var(--text);
      }

      .content blockquote {
        margin: 1.5rem 0;
        padding: 0.25rem 0 0.25rem 1rem;
        border-left: 3px solid var(--line);
        color: var(--muted);
      }

      .content table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
      }

      .content th,
      .content td {
        text-align: left;
        padding: 0.75rem;
        border-bottom: 1px solid var(--line);
      }

      .content hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 2.5rem 0;
      }

      .page-end {
        display: block;
        width: min(100%, 90ch);
        height: auto;
        margin: 2.5rem auto 0;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      @media (max-width: 960px) {
        .page {
          width: 100%;
        }

        .layout {
          display: block;
        }

        .toc {
          position: fixed;
          inset: 0;
          z-index: 20;
          display: flex;
          flex-direction: column;
          gap: 0;
          padding: 4.8rem 1.1rem 1.5rem;
          background: rgba(248, 251, 248, 0.98);
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
          transform: translateY(1rem);
          transition: opacity 140ms ease, transform 140ms ease, visibility 0s linear 140ms;
          max-height: none;
          overflow: hidden;
        }

        .toc::before {
          content: "";
          position: absolute;
          top: 5.6rem;
          right: 1.2rem;
          width: min(48vw, 15rem);
          aspect-ratio: 1140 / 1520;
          background: url("leaf-fractal.webp") center / contain no-repeat;
          opacity: 0.14;
          pointer-events: none;
        }

        body.toc-open {
          overflow: hidden;
        }

        body.toc-open .toc {
          opacity: 1;
          visibility: visible;
          pointer-events: auto;
          transform: translateY(0);
          transition: opacity 140ms ease, transform 140ms ease;
        }

        .menu-button {
          appearance: none;
          border: 1px solid var(--line);
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.96);
          color: var(--text);
          font: inherit;
          line-height: 1;
          cursor: pointer;
        }

        .menu-button {
          position: fixed;
          top: calc(env(safe-area-inset-top, 0px) + 1.5rem);
          right: calc(env(safe-area-inset-right, 0px) + 0.9rem);
          z-index: 25;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-height: 2.75rem;
          padding: 0.72rem 1rem;
          font-size: 1rem;
        }

        .toc-leaf {
          display: none;
        }

        .toc > ul {
          position: relative;
          z-index: 1;
          flex: 1 1 auto;
          overflow: auto;
          padding-bottom: 3rem;
        }

        .toc ul ul {
          padding-left: 1.15rem;
        }

        .toc a {
          min-height: 2.1rem;
          font-size: 1.08rem;
          line-height: 1.35;
        }

        .content {
          grid-column: auto;
          width: 100%;
          max-width: 90ch;
          margin: 0 auto;
          min-width: 0;
          padding: 1.5rem 1rem 0;
        }

        .content h1 {
          font-size: clamp(2.4rem, 12vw, 3rem);
        }

        .content h2 {
          font-size: clamp(1.85rem, 8vw, 2.2rem);
        }

        .content h3 {
          font-size: clamp(1.32rem, 5vw, 1.55rem);
        }

        .content p,
        .content li,
        .content td,
        .content th {
          font-size: 1.08rem;
          line-height: 1.72;
        }

        .content code,
        .content pre,
        .content samp {
          font-size: 1rem;
        }

        .content pre {
          padding: 0.9rem 0.95rem;
          border-radius: 0.7rem;
        }

        .content table {
          display: block;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }

        .page-end {
          width: 100%;
          margin-top: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
$if(toc)$
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="$idprefix$TOC">Content</button>
$endif$
      <div class="layout">
$if(toc)$
        <nav id="$idprefix$TOC" class="toc" role="doc-toc">
          <div class="toc-leaf" aria-hidden="true">
            <img class="toc-leaf__image" src="leaf-fractal.webp" alt="" width="1140" height="1520" loading="eager" fetchpriority="high" draggable="false">
          </div>
          $toc$
        </nav>
$endif$
        <article class="content">
          $body$
        </article>
      </div>
      <img class="page-end" src="leaf-end.webp" alt="" width="2200" height="1610" draggable="false">
    </main>
    <script>
      (() => {
        const menuButton = document.querySelector(".menu-button");
        const toc = document.querySelector(".toc");

        if (!menuButton || !toc) return;

        const setOpen = (open) => {
          document.body.classList.toggle("toc-open", open);
          menuButton.setAttribute("aria-expanded", open ? "true" : "false");
        };

        menuButton.addEventListener("click", () => {
          setOpen(!document.body.classList.contains("toc-open"));
        });

        toc.addEventListener("click", (event) => {
          if (event.target === toc || event.target.closest("a")) {
            setOpen(false);
          }
        });
      })();
    </script>
  </body>
</html>
